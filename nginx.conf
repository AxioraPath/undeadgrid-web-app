# Nginx del contenedor del frontend Undead Grid.
# Sirve el SPA (React Router) y hace de proxy del WebSocket/API hacia el
# backend, que en Dokploy es alcanzable por el nombre del servicio Swarm.
# Así front y back pueden vivir en dominios distintos sin CORS en el navegador.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream undeadgrid_backend {
    # Nombre del servicio del backend en la red overlay de Dokploy.
    server undeadgrid-service-bbcbit:3000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /socket.io/ {
        proxy_pass http://undeadgrid_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://undeadgrid_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://undeadgrid_backend;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

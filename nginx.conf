# Nginx del contenedor del frontend Undead Grid.
# Solo sirve el SPA (React Router). El frontend habla con el backend a través
# de su propio dominio público (VITE_API_URL), no por proxy interno, para
# evitar acoplar contenedores. El backend habilita CORS para este origen.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Assets con hash de Vite: cache inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta sirve index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
